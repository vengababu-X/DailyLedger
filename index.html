<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ledgerly</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div class="app">

  <!-- HEADER -->
  <header class="header">
    <h1>Ledgerly</h1>
    <span>January 2026</span>
  </header>

  <!-- BALANCE CARD -->
  <div class="card balance-card">
    <div class="balance-label">Total Spent</div>
    <div class="balance-amount">₹ <span id="total">0</span></div>
    <div class="balance-footer">
      <span>Budget ₹5000</span>
      <span id="status">On track</span>
    </div>
  </div>

  <!-- STATS -->
  <div class="stats">
    <div class="stat-card">
      <span>Food</span>
      <strong id="foodTotal">₹0</strong>
    </div>
    <div class="stat-card">
      <span>Travel</span>
      <strong id="travelTotal">₹0</strong>
    </div>
    <div class="stat-card">
      <span>Shopping</span>
      <strong id="shoppingTotal">₹0</strong>
    </div>
    <div class="stat-card">
      <span>Bills</span>
      <strong id="billsTotal">₹0</strong>
    </div>
  </div>

  <!-- ANALYTICS -->
  <div class="card chart-card">
    <canvas id="chart"></canvas>
  </div>

  <!-- TRANSACTIONS -->
  <div class="card">
    <h3>Recent Expenses</h3>
    <ul id="list"></ul>
  </div>

</div>

<!-- ADD BUTTON -->
<button class="fab" id="open">＋</button>

<!-- ADD SHEET -->
<div class="sheet hidden" id="sheet">
  <div class="sheet-content">
    <h3>Add Expense</h3>
    <input id="amount" type="number" placeholder="Amount ₹">
    <select id="category">
      <option>Food</option>
      <option>Travel</option>
      <option>Shopping</option>
      <option>Bills</option>
    </select>
    <input id="note" placeholder="Note (optional)">
    <button id="save">Save</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
