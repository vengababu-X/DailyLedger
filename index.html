<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ledgerly</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<header class="summary">
  <div class="amount-row">
    <span class="currency">₹</span>
    <span id="totalAmount">0</span>
  </div>
  <div class="meta">
    <span id="monthLabel">January 2026</span>
    <span id="budgetLabel">Budget ₹5000</span>
  </div>
</header>

<section class="chart-wrap">
  <canvas id="chart"></canvas>
</section>

<section id="categories"></section>

<ul id="list"></ul>

<button id="fab">＋</button>

<div id="sheet" class="hidden">
  <div class="sheet">
    <input id="amount" type="number" placeholder="₹ Amount" />
    <div class="cats">
      <button data-cat="Food">🍔</button>
      <button data-cat="Travel">🚕</button>
      <button data-cat="Shopping">🛍</button>
      <button data-cat="Bills">💡</button>
    </div>
    <input id="note" placeholder="Note (optional)" />
    <button id="save">Add expense</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
