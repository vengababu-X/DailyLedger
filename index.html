<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ledgerly</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div class="app">

  <!-- HEADER -->
  <header class="header">
    <button id="prevMonth">‹</button>
    <h1 id="monthLabel">Ledgerly</h1>
    <button id="nextMonth">›</button>
  </header>

  <!-- SUMMARY -->
  <div class="card summary">
    <div>
      <p>Spent</p>
      <h2>₹ <span id="spent">0</span></h2>
    </div>
    <div>
      <p>Saved</p>
      <h2>₹ <span id="saved">0</span></h2>
    </div>
    <div>
      <p>To Pay</p>
      <h2>₹ <span id="payable">0</span></h2>
    </div>
  </div>

  <!-- ADD ENTRY -->
  <div class="card">
    <select id="type">
      <option value="spend">Spend</option>
      <option value="save">Save</option>
      <option value="pay">To Pay</option>
    </select>

    <input id="amount" type="number" placeholder="Amount ₹" />
    <input id="note" placeholder="Note (who / why)" />

    <select id="category">
      <option>Food</option>
      <option>Travel</option>
      <option>Shopping</option>
      <option>Bills</option>
    </select>

    <button id="addEntry">Add</button>
  </div>

  <!-- BAR CHART -->
  <div class="card">
    <h3>Spend vs Save</h3>
    <canvas id="barChart"></canvas>
  </div>

  <!-- PIE CHART -->
  <div class="card">
    <h3>Spending by Category</h3>
    <canvas id="pieChart"></canvas>
  </div>

  <!-- ENTRIES -->
  <div class="card">
    <h3>Entries</h3>
    <ul id="list"></ul>
  </div>

</div>

<script src="app.js"></script>
</body>
</html>
